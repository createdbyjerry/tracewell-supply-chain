<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Natural gas supply chain — Tracewell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/twsc.css" />
</head>
<body data-twsc-standalone>
<div id="twsc-root"></div>
<!-- Apply the saved theme before first paint (light is the default). twsc.js keeps it in sync after that. -->
<script>try{var t=localStorage.getItem('twsc-theme');if(t==='dark'||t==='light')document.getElementById('twsc-root').dataset.theme=t}catch(e){}</script>
<script src="assets/twsc.js" defer></script>
</body>
</html>
